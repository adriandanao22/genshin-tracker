name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Required by the branch ruleset — must stay green to merge.
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true
      - name: Build
        run: npm run build
        env:
          # Not used at build time (routes read env at request time); a dummy
          # keeps any accidental build-time access from failing CI.
          HOYOLAB_SESSION_SECRET: ci-build-placeholder
